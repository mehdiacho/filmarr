name: Release

# Builds a signed Play AAB on a version tag (e.g. `v1.0.0`) or manual dispatch.
# Signing key + Firebase config come from repo secrets (already set):
#   KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS, GOOGLE_SERVICES_JSON_BASE64
# Add TMDB_READ_TOKEN and (for Play upload) PLAY_SERVICE_ACCOUNT_JSON when ready.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Decode secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          printf 'TMDB_READ_TOKEN=%s\n' "${{ secrets.TMDB_READ_TOKEN }}" > .env

      - name: Build signed AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FILMARR_VERSION_CODE: ${{ github.run_number }}
          FILMARR_VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew bundleRelease --no-daemon --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: filmarr-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # Play upload — enable once a Play Console app + service account JSON exist.
      # - uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: app.greenforrest.filmarr
      #     releaseFiles: app/build/outputs/bundle/release/app-release.aab
      #     track: internal
